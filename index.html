<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="container-left">
                <div>
                    <h3>HOME</h3>
                </div>
                <div class="home-score">
                    <div class="box" id="home-score-el">0</div>
                </div>
                <div class="buttons-left">
                    <button id="home-score-el" onclick=homeScoreOne()>+1</button>
                    <button id="home-score-el" onclick=homeScoreTwo()>+2</button>
                    <button id="home-score-el" onclick=homeScoreThree()>+3</button>
                </div>
            </div>
            <div class ="container-right">
                <div>
                    <h3>AWAY</h3>
                </div>
                <div class="guest-score">
                    <div class="box" id="guest-score-el">0</div>
                </div>
                <div class="buttons-right">
                    <button id="guest-score-el" onclick=guestScoreOne()>+1</button>
                    <button id="guest-score-el" onclick=guestScoreTwo()>+2</button>
                    <button id="guest-score-el" onclick=guestScoreThree()>+3</button>
                </div>
            </div>
        <script src="index.js"></script>
    </body>
</html>
